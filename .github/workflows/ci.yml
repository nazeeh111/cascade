name: Rebuild real-data quickstart
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: python -m pip install uv && uv sync --frozen
      - name: Test temporal, leakage and recovery contracts
        run: uv run pytest -q
      - name: Rebuild and test bundled real-data warehouse
        run: uv run cascade quickstart
      - name: Verify frozen scientific evidence and snapshot hashes
        run: uv run cascade verify
      - name: Check browser source syntax
        run: node --check web/dist/app.js
