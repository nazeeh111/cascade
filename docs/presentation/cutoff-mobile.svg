<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 375 840" role="img" aria-labelledby="title desc"><title id="title">A forecast is not hindsight. A scenario is not a saving.</title><desc id="desc">Denver on 19 October 2023 at 16:00 UTC. The frozen model predicted 30.4 percent disruption among 28 scheduled departures. The later final rate was 53.6 percent. The separate fixed 16:00 UTC recovery experiment reported 42.5 hypothetical minutes, not measured savings. All bar lengths use a shared zero to 100 percent scale.</desc><rect width="375" height="840" fill="#f5f3eb"/><text x="22" y="32" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#526b70">CASCADE / ONE CUTOFF, THREE CLAIMS</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#17313b">A forecast is not hindsight.</text><text x="22" y="110" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#17313b">A scenario is not a saving.</text><text x="22" y="166" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#17313b">DEN · 19 OCT 2023 · 16:00 UTC · 28 departures</text><text x="22" y="204" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#526b70">01 / WHAT WAS AVAILABLE AT CUTOFF</text><text x="22" y="231" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#17313b">Latest event available: 15:59 UTC</text><text x="22" y="254" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#17313b">Weather eligible: 16:00 UTC</text><text x="22" y="277" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#17313b">Declared event/weather lags: 15/60 min</text><text x="22" y="345" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#17313b">Forecast</text><text x="283" y="345" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#17313b">30.4%</text><rect x="22" y="357" width="221" height="10" fill="#dddcd2"/><rect data-key="prediction" x="22" y="357" width="67.2699061370" height="10" fill="#17313b"/><text x="22" y="409" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#17313b">Later outcome</text><text x="283" y="409" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#17313b">53.6%</text><rect x="22" y="421" width="221" height="10" fill="#dddcd2"/><rect data-key="target_rate" x="22" y="421" width="118.3928571429" height="10" fill="#b45c35"/><text x="22" y="471" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#526b70">Shared scale: 0–100% · late ≥15min or cancelled</text><text x="22" y="547" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#526b70">02 / SEPARATE SIMULATION</text><text x="22" y="586" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#17313b">42.5 hypothetical minutes</text><text x="22" y="618" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#17313b">4 bounded teams · DEN 2 / LAS 2</text><text x="22" y="643" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#17313b">Fixed 16:00 UTC, not cursor dependent.</text><text x="22" y="668" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#17313b">Actual-tail topology uses hindsight.</text><text x="22" y="693" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#17313b">Held-out baseline late15 recall: 11.2%.</text><text x="22" y="718" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#17313b">Not causal savings or staffing advice.</text><text x="22" y="779" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#17313b">The final label was available on 20 Oct at 06:00 UTC.</text><text x="22" y="802" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#17313b">Frozen historical outputs. No new model or simulator run.</text></svg>